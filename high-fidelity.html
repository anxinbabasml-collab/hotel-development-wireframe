<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>酒店拓展 H5｜高保真原型</title>
  <style>
    :root {
      --ink: #181b1f;
      --muted: #69717c;
      --line: #c8cdd3;
      --soft-line: #e3e6e9;
      --paper: #fff;
      --canvas: #eef0f2;
      --panel: #f7f8f9;
      --accent: #1d63d5;
      --accent-soft: #e9f0fc;
      --danger: #a22a2a;
      --success: #1c6a43;
      --radius: 10px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(24, 27, 31, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24, 27, 31, .035) 1px, transparent 1px),
        var(--canvas);
      background-size: 24px 24px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    button, input, select, textarea { font: inherit; }
    button { touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(29, 99, 213, .3);
      outline-offset: 2px;
    }

    .workspace {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 300px minmax(390px, 1fr) 300px;
    }

    .rail {
      position: sticky;
      top: 0;
      height: 100dvh;
      overflow: auto;
      padding: 24px;
      background: rgba(247, 248, 249, .96);
      border-right: 1px solid var(--line);
    }

    .rail.right {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.25;
    }

    .intro {
      margin: 10px 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .role-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: #e6e9ec;
      border-radius: 10px;
    }

    .role-switch button {
      min-height: 44px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .role-switch button.active {
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 1px 3px rgba(20, 25, 30, .15);
      font-weight: 700;
    }

    .section-label {
      margin: 24px 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .flow-list {
      display: grid;
      gap: 4px;
    }

    .flow-item {
      width: 100%;
      min-height: 44px;
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .flow-item:hover { background: #eceff2; }
    .flow-item.active {
      color: var(--accent);
      border-color: #a9c4ee;
      background: var(--accent-soft);
      font-weight: 700;
    }

    .flow-no {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 11px;
    }

    .stage {
      min-width: 0;
      display: grid;
      place-items: center;
      padding: 36px 24px;
    }

    .phone-wrap { width: min(390px, 100%); }
    .screen-caption {
      min-height: 28px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .screen-caption strong { color: var(--ink); }
    .phone {
      position: relative;
      height: min(780px, calc(100dvh - 112px));
      min-height: 620px;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 32px;
      background: var(--paper);
      box-shadow: 0 18px 45px rgba(20, 25, 30, .18);
    }

    .phone::before {
      content: "";
      position: absolute;
      z-index: 20;
      top: 8px;
      left: 50%;
      width: 94px;
      height: 24px;
      border-radius: 16px;
      background: var(--ink);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .app-screen,
    #screenRoot {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding-top: 39px;
      background: var(--panel);
    }

    .topbar {
      min-height: 54px;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      padding: 0 8px;
      background: var(--paper);
      border-bottom: 1px solid var(--soft-line);
    }

    .topbar h2 {
      margin: 0;
      font-size: 17px;
      text-align: center;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
    }

    .icon-btn:hover { background: var(--panel); }
    .icon-btn svg { width: 21px; height: 21px; }
    .topbar-spacer { width: 44px; height: 44px; }

    .content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: 16px 16px 96px;
    }

    .hero {
      margin-bottom: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
    }

    .hero h3 { margin: 0 0 4px; font-size: 21px; }
    .hero p { margin: 0; color: var(--muted); font-size: 14px; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .stat {
      padding: 10px 8px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      text-align: center;
    }
    .stat strong { display: block; font-size: 20px; }
    .stat span { color: var(--muted); font-size: 11px; }

    .card {
      margin-bottom: 12px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
    }

    .card-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .card-title h3, .card-title h4 { margin: 0; font-size: 16px; }
    .card-title small { color: var(--muted); }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0 10px;
    }
    .section-head .section-label { margin: 0; }
    .section-head button {
      min-height: 44px;
      padding: 6px 4px;
      border: 0;
      color: var(--accent);
      background: transparent;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      margin: 12px -16px 16px;
      padding: 0 16px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      min-height: 40px;
      flex: 0 0 auto;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--paper);
      font-size: 13px;
      cursor: pointer;
    }
    .chip.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 700;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .summary-cell {
      min-width: 0;
      padding: 11px 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fafafa;
    }
    .summary-cell span {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
    }
    .summary-cell strong {
      display: block;
      overflow-wrap: anywhere;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 10px;
    }
    .field-grid .wide { grid-column: 1 / -1; }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .media-placeholder {
      min-height: 76px;
      display: grid;
      place-items: center;
      padding: 8px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fafafa;
      text-align: center;
      font-size: 11px;
    }

    details.detail-group {
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
    }
    details.detail-group summary {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 15px;
      font-weight: 700;
      cursor: pointer;
    }
    details.detail-group summary::after {
      content: "展开";
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }
    details.detail-group[open] summary::after { content: "收起"; }
    .detail-body {
      padding: 0 15px 12px;
      border-top: 1px solid var(--soft-line);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 26px;
      padding: 3px 8px;
      border: 1px solid currentColor;
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .status.pending { color: #875d0c; }
    .status.success { color: var(--success); }
    .status.danger { color: var(--danger); }
    .status.info { color: var(--accent); }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }
    .required { color: var(--danger); }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 48px;
      padding: 11px 12px;
      border: 1px solid #aeb5bd;
      border-radius: 8px;
      color: var(--ink);
      background: var(--paper);
      font-size: 16px;
    }
    .field textarea { min-height: 82px; resize: vertical; }
    .field .hint { margin: 5px 0 0; color: var(--muted); font-size: 12px; }

    .upload {
      min-height: 126px;
      display: grid;
      place-items: center;
      padding: 16px;
      border: 1px dashed #8b939d;
      border-radius: 8px;
      color: var(--muted);
      background: #fafafa;
      text-align: center;
      cursor: pointer;
    }
    .upload svg { width: 28px; height: 28px; margin-bottom: 6px; }
    .upload strong { display: block; color: var(--ink); font-size: 14px; }
    .upload small { display: block; margin-top: 3px; }

    .check-row, .info-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--soft-line);
      font-size: 14px;
    }
    .check-row:last-child, .info-row:last-child { border-bottom: 0; }
    .check-row span:first-child, .info-row span:first-child { color: var(--muted); }
    .check-row strong, .info-row strong { text-align: right; }

    .radio-card {
      width: 100%;
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--paper);
      text-align: left;
      cursor: pointer;
    }
    .radio-card.active { border: 2px solid var(--accent); background: var(--accent-soft); }
    .radio-dot {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      border: 2px solid var(--line);
      border-radius: 50%;
    }
    .active .radio-dot { border: 6px solid var(--accent); background: white; }
    .radio-card small { display: block; color: var(--muted); }

    .stepper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 16px;
    }
    .step {
      position: relative;
      padding-top: 22px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }
    .step::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 50%;
      width: 9px;
      height: 9px;
      z-index: 2;
      border: 2px solid var(--line);
      border-radius: 50%;
      background: var(--paper);
      transform: translateX(-50%);
    }
    .step::after {
      content: "";
      position: absolute;
      top: 11px;
      left: -50%;
      width: 100%;
      height: 1px;
      background: var(--line);
    }
    .step:first-child::after { display: none; }
    .step.done, .step.active { color: var(--ink); font-weight: 700; }
    .step.done::before, .step.active::before { border-color: var(--accent); background: var(--accent); }
    .step.done::after, .step.active::after { background: var(--accent); }

    .notice {
      margin-bottom: 14px;
      padding: 12px;
      border-left: 4px solid var(--muted);
      background: #eceff1;
      color: #454b53;
      font-size: 13px;
    }
    .notice.info { border-color: var(--accent); background: var(--accent-soft); }
    .notice.danger { border-color: var(--danger); background: #f7eaea; color: #6f2222; }
    .notice.success { border-color: var(--success); background: #e8f3ed; color: #174d34; }

    .empty, .result {
      min-height: 360px;
      display: grid;
      place-content: center;
      padding: 26px;
      text-align: center;
    }
    .result-icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
      font-size: 30px;
      font-weight: 700;
    }
    .result h3 { margin: 0 0 8px; font-size: 21px; }
    .result p { margin: 0 auto 20px; color: var(--muted); font-size: 14px; }

    .timeline { padding-left: 9px; }
    .timeline-item {
      position: relative;
      padding: 0 0 22px 25px;
      border-left: 1px solid var(--line);
    }
    .timeline-item:last-child { padding-bottom: 0; border-left-color: transparent; }
    .timeline-item::before {
      content: "";
      position: absolute;
      top: 2px;
      left: -6px;
      width: 10px;
      height: 10px;
      border: 1px solid var(--muted);
      border-radius: 50%;
      background: var(--paper);
    }
    .timeline-item.current::before { border-color: var(--accent); background: var(--accent); }
    .timeline-item.done::before { border-color: var(--success); background: var(--success); }
    .timeline-item.danger::before { border-color: var(--danger); background: var(--danger); }
    .timeline-item strong { display: block; font-size: 14px; }
    .timeline-item small { color: var(--muted); }

    .audit-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 10px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .bottom-actions {
      position: absolute;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--soft-line);
      background: rgba(255, 255, 255, .97);
    }
    .bottom-actions.single { grid-template-columns: 1fr; }

    .btn {
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid var(--ink);
      border-radius: 8px;
      color: var(--ink);
      background: var(--paper);
      font-weight: 700;
      cursor: pointer;
    }
    .btn.primary { color: white; border-color: var(--accent); background: var(--accent); }
    .btn.danger { color: var(--danger); border-color: var(--danger); }
    .btn:active { opacity: .75; }
    .btn.full { width: 100%; }
    /* Inline action arrows need an explicit size; otherwise SVG uses its browser default canvas. */
    .btn svg, .text-action svg { width: 17px; height: 17px; display: inline-block; vertical-align: -4px; margin-left: 6px; }

    .bottom-nav {
      position: absolute;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      min-height: 76px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--soft-line);
      background: rgba(255, 255, 255, .97);
    }
    .nav-item {
      min-height: 52px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }
    .nav-item.active { color: var(--accent); font-weight: 700; }
    .nav-item svg { width: 21px; height: 21px; }

    .annotation-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
    }
    .annotation-no {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }
    .annotation-title h2 { margin: 0; font-size: 17px; }
    .annotation {
      padding: 12px 0;
      border-top: 1px solid var(--soft-line);
    }
    .annotation:first-of-type { border-top: 0; }
    .annotation strong { display: block; margin-bottom: 3px; font-size: 13px; }
    .annotation p { margin: 0; color: var(--muted); font-size: 13px; }
    .branch {
      margin-top: 16px;
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: white;
      font-size: 12px;
    }
    .branch strong { display: block; margin-bottom: 5px; }

    .mobile-header { display: none; }
    .drawer-backdrop { display: none; }

    @media (max-width: 1040px) {
      .workspace { grid-template-columns: 270px minmax(390px, 1fr); }
      .rail.right { display: none; }
    }

    @media (max-width: 720px) {
      body { background: var(--paper); }
      .workspace { display: block; }
      .rail.left {
        position: fixed;
        z-index: 50;
        top: 0;
        left: 0;
        width: min(320px, 88vw);
        height: 100dvh;
        transform: translateX(-105%);
        transition: transform .22s ease;
        box-shadow: 10px 0 30px rgba(0,0,0,.2);
      }
      .rail.left.open { transform: translateX(0); }
      .drawer-backdrop.open {
        position: fixed;
        z-index: 45;
        inset: 0;
        display: block;
        border: 0;
        background: rgba(0,0,0,.45);
      }
      .mobile-header {
        position: fixed;
        z-index: 30;
        top: 0;
        right: 0;
        left: 0;
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: env(safe-area-inset-top) 8px 0;
        border-bottom: 1px solid var(--line);
        background: white;
      }
      .mobile-header strong { font-size: 14px; }
      .stage { min-height: 100dvh; padding: 52px 0 0; }
      .phone-wrap { width: 100%; }
      .screen-caption { display: none; }
      .phone {
        height: calc(100dvh - 52px);
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .phone::before { display: none; }
      .app-screen, #screenRoot { padding-top: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
  <style>
    /* High-fidelity brand layer: supplied JZZC red logo system */
    :root {
      --ink: #14213d;
      --muted: #6f7f99;
      --line: #d9e4f3;
      --soft-line: #edf2f8;
      --paper: #ffffff;
      --canvas: #fff5f5;
      --panel: #fffafb;
      --accent: #d70110;
      --accent-strong: #b5000d;
      --accent-deep: #8f0009;
      --accent-soft: #fff0f1;
      --danger: #d9485f;
      --success: #1c9b72;
      --warning: #bf7d1a;
      --radius: 16px;
      --shadow-sm: 0 6px 18px rgba(139, 15, 25, .07);
      --shadow-md: 0 18px 44px rgba(139, 15, 25, .15);
    }

    body {
      background:
        radial-gradient(circle at 15% 0%, rgba(215, 1, 16, .13), transparent 30%),
        radial-gradient(circle at 88% 22%, rgba(245, 139, 147, .16), transparent 24%),
        var(--canvas);
      color: var(--ink);
    }

    .workspace { grid-template-columns: 292px minmax(430px, 1fr) 320px; }
    .rail {
      padding: 26px 22px;
      background: rgba(255, 255, 255, .9);
      border-color: var(--line);
      box-shadow: inset -1px 0 0 rgba(255,255,255,.65);
    }
    .rail.right { box-shadow: inset 1px 0 0 rgba(255,255,255,.65); }
    .brand-mark {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;

    .profile-summary { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
    .profile-summary-item { padding: 11px; border: 1px solid rgba(255,255,255,.2); border-radius: 13px; background: rgba(255,255,255,.12); }
    .profile-summary-item span { display: block; color: rgba(255,255,255,.68); font-size: 10px; }
    .profile-summary-item strong { display: block; margin-top: 3px; color: #fff; font-size: 14px; }
    .profile-section-title { display: flex; align-items: center; justify-content: space-between; margin: 20px 2px 9px; }
    .profile-section-title h3 { margin: 0; font-size: 15px; }
    .profile-section-title small { color: #a18488; font-size: 11px; }
    .profile-list { overflow: hidden; border: 1px solid #f0dfe1; border-radius: 17px; background: #fff; box-shadow: var(--shadow-sm); }
    .profile-row { width: 100%; min-height: 64px; display: flex; align-items: center; gap: 11px; padding: 11px 14px; border: 0; border-bottom: 1px solid #f5e8e9; color: var(--ink); background: #fff; text-align: left; }
    .profile-row:last-child { border-bottom: 0; }
    .profile-row .quick-icon { width: 34px; height: 34px; flex: 0 0 auto; }
    .profile-row-copy { min-width: 0; flex: 1; }
    .profile-row-copy strong { display: block; font-size: 13px; }
    .profile-row-copy small { display: block; margin-top: 3px; overflow: hidden; color: #8c7c80; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .profile-row > svg { width: 17px; height: 17px; color: #b8898e; }
    .profile-row.link { cursor: pointer; }
    .profile-row.link:hover { background: #fff7f8; }
    .profile-note { margin-top: 13px; }
    .archive-section { margin-top: 14px; padding: 16px; border: 1px solid #f0dfe1; border-radius: 17px; background: #fff; box-shadow: var(--shadow-sm); }
    .archive-section h3 { margin: 0 0 12px; font-size: 14px; }
    .search-panel { padding: 18px; border: 1px solid #f0dfe1; border-radius: 19px; background: #fff; box-shadow: var(--shadow-sm); }
    .search-panel .field:last-child { margin-bottom: 0; }
    .candidate-card { width: 100%; display: flex; align-items: flex-start; gap: 11px; margin-bottom: 10px; padding: 15px; border: 1px solid #f0dfe1; border-radius: 17px; color: var(--ink); background: #fff; text-align: left; box-shadow: var(--shadow-sm); cursor: pointer; }
    .candidate-card.active { border-color: #e87b85; background: #fff3f4; box-shadow: 0 7px 17px rgba(215,1,16,.1); }
    .candidate-card .radio-dot { margin-top: 2px; }
    .candidate-card strong { display: block; font-size: 14px; }
    .candidate-card small { display: block; margin-top: 4px; color: #8c7c80; font-size: 11px; }
    .candidate-card small + small { margin-top: 2px; }
    .form-section { padding: 17px; border: 1px solid #f0dfe1; border-radius: 18px; background: #fff; box-shadow: var(--shadow-sm); }
    .form-section + .form-section { margin-top: 11px; }
    .form-section-title { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    .form-section-title .quick-icon { width: 30px; height: 30px; }
    .form-section-title h3 { margin: 0; font-size: 14px; }
    .form-section-title small { display: block; margin-top: 2px; color: #a18488; font-size: 10px; }
    .manager-card { display: flex; align-items: center; gap: 11px; padding: 13px; border: 1px solid #f0dfe1; border-radius: 14px; background: #fff7f7; }
    .manager-card .avatar { width: 36px; height: 36px; border: 0; color: #fff; background: #d70110; font-size: 13px; }
    .manager-card strong { display: block; font-size: 13px; }
    .manager-card small { display: block; margin-top: 3px; color: #8c7c80; font-size: 11px; }
    .reject-panel { padding: 16px; border: 1px solid #f0c5c9; border-radius: 17px; background: #fff7f7; }
    .reject-panel strong { display: block; margin-bottom: 5px; color: #a5000b; font-size: 14px; }
    .reject-panel p { margin: 0; color: #80555a; font-size: 12px; line-height: 1.6; }
    .terminal-panel { padding: 21px 17px; border-radius: 21px; background: #fff; box-shadow: var(--shadow-sm); text-align: center; }
    .terminal-panel .result-icon { margin-bottom: 13px; background: linear-gradient(135deg, #9b6b1c, #e0ad58); }
    .terminal-panel h3 { margin: 0 0 7px; font-size: 20px; }
    .terminal-panel > p { margin: 0 auto 17px; color: #8c7c80; font-size: 13px; }
    .media-wall { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
    .media-tile { min-height: 82px; display: grid; place-items: end start; padding: 10px; border-radius: 13px; color: #fff; background: linear-gradient(145deg, #d97b80, #8f0009); font-size: 11px; font-weight: 700; }
    .media-tile:nth-child(2) { background: linear-gradient(145deg, #e7b4b7, #b53c46); }
    .media-tile:nth-child(3) { background: linear-gradient(145deg, #c58c66, #763021); }

    @media (min-width: 721px) and (max-width: 1100px) {
      .workspace { grid-template-columns: 270px minmax(430px, 1fr); }
      .stage { padding-inline: 16px; }
      .phone-wrap { width: min(430px, 100%); }
    }
    @media (max-width: 720px) {
      body { background: var(--paper); }
      .mobile-header { min-height: 56px; }
      .stage { padding-top: 56px; }
      .phone { border: 0; }
      .content { padding-inline: 16px; }
      .hero { border-radius: 18px; }
    }
  </style>
</head>
<body>
  <div class="workspace">
    <aside class="rail left" id="flowRail" aria-label="原型流程导航">
      <p class="eyebrow brand-mark"><img src="assets/jzzc-logo.png" alt="酒店拓展品牌 Logo"><span>JZZC HOTEL</span></p>
      <h1>酒店拓展 UE</h1>
      <p class="intro">高保真移动 H5 原型 · 客户经理发展线下酒店，并与酒店销售经理协同完成入驻、审核、试用和转正。</p>
      <div class="role-switch" role="tablist" aria-label="角色切换">
        <button type="button" id="managerRole" class="active" role="tab" aria-selected="true">联通客户经理</button>
        <button type="button" id="hotelRole" role="tab" aria-selected="false">酒店销售经理</button>
      </div>
      <p class="section-label">页面流程 · 点击跳转</p>
      <nav class="flow-list" id="flowList"></nav>
    </aside>

    <button class="drawer-backdrop" id="drawerBackdrop" aria-label="关闭流程导航"></button>

    <header class="mobile-header">
      <button class="icon-btn" id="openFlow" aria-label="打开流程导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="mobile-brand"><img src="assets/jzzc-logo.png" alt="酒店拓展品牌 Logo"><strong id="mobileCaption">酒店拓展 UE</strong></span>
      <button class="icon-btn" id="mobileRole" aria-label="切换角色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7"/></svg>
      </button>
    </header>

    <main class="stage">
      <div class="phone-wrap">
        <div class="screen-caption">
          <span><strong id="screenName">M01 拓展工作台</strong> · 375 × 812</span>
          <span id="roleCaption">联通客户经理端</span>
        </div>
        <section class="phone" aria-live="polite">
          <div id="screenRoot"></div>
        </section>
      </div>
    </main>

    <aside class="rail right" aria-label="页面设计说明">
      <div class="annotation-title">
        <span class="annotation-no" id="annotationNo">M01</span>
        <h2 id="annotationTitle">拓展工作台</h2>
      </div>
      <div id="annotations"></div>
      <div class="branch" id="branchInfo"></div>
    </aside>
  </div>

  <script>
    const icons = {
      back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>',
      home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
      list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
      user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
      upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 15v5h16v-5"/></svg>',
      search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
      building: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v16M2 21h20M8 7h2M13 7h2M8 11h2M13 11h2M8 15h2M13 15h2"/></svg>',
      arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h13m-5-5 5 5-5 5"/></svg>',
      bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',
      trend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 16 5-5 4 3 7-8M15 6h5v5"/></svg>',
      shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 20 6v5c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg>'
    };

    const managerFlow = [
      { id: 'M01', name: '拓展工作台', note: ['聚合待处理、试用到期和近期申请。', '主操作固定为“发展新酒店”。'], branch: '主线入口 → 信用代码预查；也可从申请列表进入历史状态。' },
      { id: 'M02', name: '入驻预查', note: ['支持信用代码或营业执照识别。', '先预查再录入，避免重复拓展。'], branch: '未入驻 → M04；已入驻 → M03 终止。' },
      { id: 'M03', name: '已入驻结果', note: ['明确提示不可重复发展。', '保留联系运营入口，不提供继续提交。'], branch: '流程结束分支：酒店已被其他人员入驻，本次申请结束。' },
      { id: 'M04', name: '录入酒店资料', note: ['以下内容会作为本次申请资料保存，避免后续酒店资料变化影响审核。', '销售经理手机号作为酒店方登录账号，客户经理信息由当前账号自动带入。'], branch: '提交后系统创建酒店销售经理账号并发送邀请。' },
      { id: 'M05', name: '邀请确认', note: ['提交前再次核对酒店与联系人。', '清晰说明系统后续动作。'], branch: '确认 → M06；返回可修改资料。' },
      { id: 'M06', name: '邀请已发送', note: ['展示结果和下一步责任人。', '允许返回工作台或查看申请。'], branch: '酒店销售经理收到短信 → 酒店端 H01。' },
      { id: 'M07', name: '合作申请列表', note: ['多种合作状态转成可读筛选项，状态不只依赖颜色。', '列表优先展示酒店、联系人、编码和下一处理时间。'], branch: '待审核 → M08；试用期 → M09；正式合作/负责人变更 → M11。' },
      { id: 'M08', name: '合作申请审核', note: ['将申请资料、酒店档案、执照和位置分组核验。', '审核动作写入审核历史，拒绝必须填写原因并通知酒店。'], branch: '通过 → 生成试用合作编码并进入试用期；拒绝可重提或结束流程。' },
      { id: 'M09', name: '试用期与转正', note: ['直接展示试用合作编码、试用起止时间和合作联系人。', '转正或终止均写入审核历史。'], branch: '继续合作 → M12 正式合作；不续约 → M13 合作终止。' },
      { id: 'M10', name: '酒店完整档案', note: ['将酒店基础信息、位置、图片、政策、房型和产品价格按业务主题分组。', '低频字段折叠展示，避免移动端信息过载。'], branch: '从审核或合作详情进入，只读核验后返回原流程。' },
      { id: 'M11', name: '合作关系与负责人变更', note: ['展示当前负责人、历史负责人和上一段合作来源。', '负责人离职后的变更是独立操作，保留原记录以便追溯。'], branch: '发起负责人变更 → 新建待审核关系；原关系审核通过后标记为已变更。' },
      { id: 'M12', name: '正式合作结果', note: ['明确展示正式酒店编码和生效时间。', '转正结果写入审核历史并可回到合作申请列表。'], branch: '正式合作 → M07 合作申请列表；可继续查看酒店档案。' },
      { id: 'M13', name: '合作终止结果', note: ['明确展示不续约和终止原因。', '终止结果写入审核历史，流程结束。'], branch: '合作终止 → M07 合作申请列表。' },
      { id: 'M14', name: '我的', note: ['展示客户经理身份、联系方式和当前负责范围。', '提供常用入口，避免把个人信息混入合作流程。'], branch: '查看合作申请 → M07；查看酒店档案 → M10。' }
    ];

    const hotelFlow = [
      { id: 'H01', name: '邀请登录', note: ['短信深链进入，手机号预填。', '首次登录强调来源客户经理。'], branch: '验证成功 → H02 酒店搜索。' },
      { id: 'H02', name: '搜索酒店', note: ['酒店名与城市均为必填。', '避免同名酒店误选。'], branch: '搜索到 → H03；未搜索到 → H04。' },
      { id: 'H03', name: '确认已有酒店', note: ['展示关键地址和品牌信息。', '确认前必须上传营业执照，用于核对酒店信息。'], branch: '确认酒店并上传执照 → H05；不是此酒店 → H04 新增。' },
      { id: 'H04', name: '新增/完善酒店', note: ['酒店资料按基础信息、联系方式、设施服务分组。', '新增和拒绝重提共用资料页，营业执照仍为必传。'], branch: '保存草稿 → 可退出；下一步 → H05 重新选择客户经理并提交。' },
      { id: 'H05', name: '确认并选经理', note: ['默认展示邀请发起人。', '允许搜索其他客户经理。'], branch: '提交申请后短信通知所选客户经理。' },
      { id: 'H06', name: '提交成功', note: ['提供预计处理时长。', '状态入口明确可达。'], branch: '客户经理审核 → 通过进入试用 / 拒绝进入 H08。' },
      { id: 'H07', name: '合作状态', note: ['合作状态、编码和关键时间统一在一张状态卡呈现。', '审核历史展示操作人、时间与原因。'], branch: '试用到期由客户经理决定转正或终止；正式合作后可查看酒店档案。' },
      { id: 'H08', name: '拒绝与重提', note: ['区分可重提与已入驻后的结束状态。', '明确拒绝通知已发送，并定位需要修正的资料分组。'], branch: '可重提 → H04 编辑后回到 H05；已入驻 → H10 流程结束。' },
      { id: 'H09', name: '我的酒店档案', note: ['酒店基础信息、位置、图片、政策、房型和产品价格以可读摘要展示。', '展示更新时间，帮助酒店方判断资料是否需要维护。'], branch: '资料变更后重新提交审核，生成新的审核历史。' },
      { id: 'H10', name: '已被他人入驻', note: ['明确告知酒店已被其他人员入驻。', '流程结束后不提供重新提交入口，避免重复申请。'], branch: '流程结束 → 返回申请结果或结束流程。' },
      { id: 'H11', name: '我的', note: ['展示酒店销售经理和当前合作酒店。', '保留申请进度、酒店资料和账号设置入口。'], branch: '查看合作状态 → H07；查看酒店档案 → H09。' }
    ];

    let role = 'manager';
    let screenId = 'M01';

    function topbar(title, backId = '') {
      return `<header class="topbar">
        ${backId ? `<button class="icon-btn" data-go="${backId}" aria-label="返回">${icons.back}</button>` : '<span class="topbar-spacer"></span>'}
        <h2>${title}</h2><span class="topbar-spacer"></span>
      </header>`;
    }

    function bottomNav(active) {
      return `<nav class="bottom-nav" aria-label="底部导航">
        <button class="nav-item ${active === 'home' ? 'active' : ''}" data-go="${role === 'manager' ? 'M01' : 'H07'}">${icons.home}<span>首页</span></button>
        <button class="nav-item ${active === 'list' ? 'active' : ''}" data-go="${role === 'manager' ? 'M07' : 'H07'}">${icons.list}<span>申请</span></button>
        <button class="nav-item ${active === 'profile' ? 'active' : ''}" data-go="${role === 'manager' ? 'M14' : 'H11'}">${icons.user}<span>我的</span></button>
      </nav>`;
    }

    function actions(primaryLabel, primaryGo, secondaryLabel = '', secondaryGo = '') {
      return `<footer class="bottom-actions ${secondaryLabel ? '' : 'single'}">
        ${secondaryLabel ? `<button class="btn" data-go="${secondaryGo}">${secondaryLabel}</button>` : ''}
        <button class="btn primary" data-go="${primaryGo}">${primaryLabel}</button>
      </footer>`;
    }

    const screens = {
      M01: () => `${topbar('酒店拓展')}<div class="content product-home">
        <section class="product-hero">
          <div class="product-hero-top"><div><p class="product-kicker">JZZC HOTEL · 今日工作</p><h3>上午好，陈经理</h3><p>聚焦待审核与临期酒店，推进本周合作目标。</p></div><div class="avatar">陈</div></div>
          <div class="kpi-strip"><div class="kpi"><strong>2</strong><span>待审核</span></div><div class="kpi"><strong>4</strong><span>试用中</span></div><div class="kpi"><strong>1</strong><span>即将到期</span></div></div>
        </section>
        <div class="section-title-row"><div><p class="section-kicker">快捷入口</p><h3>开始一项工作</h3></div></div>
        <div class="quick-grid">
          <button class="quick-card" data-go="M02"><span class="quick-icon">${icons.building}</span><strong>发展新酒店</strong><small>录入酒店信息并发送邀请</small></button>
          <button class="quick-card" data-go="M07"><span class="quick-icon">${icons.list}</span><strong>查看合作申请</strong><small>跟进审核与试用状态</small></button>
        </div>
        <div class="section-title-row"><div><p class="section-kicker">今日待办</p><h3>优先处理</h3></div><button class="text-action" data-go="M07">查看全部</button></div>
        <div class="task-stack">
          <button class="task-card" data-go="M08"><span class="task-icon">${icons.shield}</span><span class="task-body"><span class="task-line"><strong>云栖精选酒店</strong><span class="status pending">待审核</span></span><span class="task-meta">王女士提交 · 13:42 · 需核验执照</span></span><span class="task-arrow">${icons.arrow}</span></button>
          <button class="task-card" data-go="M09"><span class="task-icon warm">${icons.trend}</span><span class="task-body"><span class="task-line"><strong>悦澜商务酒店</strong><span class="status info">7 天后到期</span></span><span class="task-meta">试用期 · 试用合作编码 M-483210</span></span><span class="task-arrow">${icons.arrow}</span></button>
        </div>
        <div class="section-title-row"><div><p class="section-kicker">本周目标</p><h3>拓展进度</h3></div><span class="section-label" style="margin:0">更新于今天 09:15</span></div>
        <div class="progress-card"><div class="progress-card-head"><span>已完成酒店拓展</span><strong>6 / 10</strong></div><div class="progress-track"><span></span></div><div class="task-meta">还差 4 家达成本周目标</div></div>

    function currentFlow() { return role === 'manager' ? managerFlow : hotelFlow; }

    function renderFlow() {
      const flow = currentFlow();
      document.getElementById('flowList').innerHTML = flow.map(item => `
        <button class="flow-item ${item.id === screenId ? 'active' : ''}" data-go="${item.id}" ${item.id === screenId ? 'aria-current="page"' : ''}>
          <span class="flow-no">${item.id.replace(/[A-Z]/, '')}</span><span>${item.name}</span>
        </button>`).join('');
      document.getElementById('managerRole').classList.toggle('active', role === 'manager');
      document.getElementById('hotelRole').classList.toggle('active', role === 'hotel');
      document.getElementById('managerRole').setAttribute('aria-selected', String(role === 'manager'));
      document.getElementById('hotelRole').setAttribute('aria-selected', String(role === 'hotel'));
    }

    function render() {
      const flow = currentFlow();
      const meta = flow.find(item => item.id === screenId) || flow[0];
      document.getElementById('screenRoot').innerHTML = screens[screenId]();
      document.getElementById('screenRoot').innerHTML = document.getElementById('screenRoot').innerHTML
        .replaceAll('酒店联系人', '酒店销售经理')
        .replaceAll('负责客户经理', '联通客户经理');
      document.getElementById('screenName').textContent = `${meta.id} ${meta.name}`;
      document.getElementById('roleCaption').textContent = role === 'manager' ? '联通客户经理端' : '酒店销售经理端';
      document.getElementById('mobileCaption').textContent = `${meta.id} ${meta.name}`;
      document.getElementById('annotationNo').textContent = meta.id;
      document.getElementById('annotationTitle').textContent = meta.name;
      document.getElementById('annotations').innerHTML = meta.note.map((text, index) => `<div class="annotation"><strong>${index + 1}. 设计要点</strong><p>${text}</p></div>`).join('');
      document.getElementById('branchInfo').innerHTML = `<strong>流程去向</strong>${meta.branch}`;
      renderFlow();
      bindNavigation();
      document.querySelector('.content')?.scrollTo(0, 0);
    }

    function go(id) {
      if (!screens[id]) return;
      role = id.startsWith('M') ? 'manager' : 'hotel';
      screenId = id;
      render();
      closeDrawer();
    }

    function bindNavigation() {
      document.querySelectorAll('[data-go]').forEach(button => {
        button.addEventListener('click', () => go(button.dataset.go));
      });
    }

    function setRole(nextRole) {
      role = nextRole;
      screenId = nextRole === 'manager' ? 'M01' : 'H01';
      render();
    }

    function closeDrawer() {
      document.getElementById('flowRail').classList.remove('open');
      document.getElementById('drawerBackdrop').classList.remove('open');
    }

    document.getElementById('managerRole').addEventListener('click', () => setRole('manager'));
    document.getElementById('hotelRole').addEventListener('click', () => setRole('hotel'));
    document.getElementById('mobileRole').addEventListener('click', () => setRole(role === 'manager' ? 'hotel' : 'manager'));
    document.getElementById('openFlow').addEventListener('click', () => {
      document.getElementById('flowRail').classList.add('open');
      document.getElementById('drawerBackdrop').classList.add('open');
    });
    document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
    render();
  </script>
