<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>酒店拓展 H5｜低保真 UE</title>
  <style>
    :root {
      --ink: #181b1f;
      --muted: #69717c;
      --line: #c8cdd3;
      --soft-line: #e3e6e9;
      --paper: #fff;
      --canvas: #eef0f2;
      --panel: #f7f8f9;
      --accent: #1d63d5;
      --accent-soft: #e9f0fc;
      --danger: #a22a2a;
      --success: #1c6a43;
      --radius: 10px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(24, 27, 31, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24, 27, 31, .035) 1px, transparent 1px),
        var(--canvas);
      background-size: 24px 24px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    button, input, select, textarea { font: inherit; }
    button { touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(29, 99, 213, .3);
      outline-offset: 2px;
    }

    .workspace {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 300px minmax(390px, 1fr) 300px;
    }

    .rail {
      position: sticky;
      top: 0;
      height: 100dvh;
      overflow: auto;
      padding: 24px;
      background: rgba(247, 248, 249, .96);
      border-right: 1px solid var(--line);
    }

    .rail.right {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.25;
    }

    .intro {
      margin: 10px 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .role-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: #e6e9ec;
      border-radius: 10px;
    }

    .role-switch button {
      min-height: 44px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .role-switch button.active {
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 1px 3px rgba(20, 25, 30, .15);
      font-weight: 700;
    }

    .section-label {
      margin: 24px 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .flow-list {
      display: grid;
      gap: 4px;
    }

    .flow-item {
      width: 100%;
      min-height: 44px;
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .flow-item:hover { background: #eceff2; }
    .flow-item.active {
      color: var(--accent);
      border-color: #a9c4ee;
      background: var(--accent-soft);
      font-weight: 700;
    }

    .flow-no {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 11px;
    }

    .stage {
      min-width: 0;
      display: grid;
      place-items: center;
      padding: 36px 24px;
    }

    .phone-wrap { width: min(390px, 100%); }
    .screen-caption {
      min-height: 28px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .screen-caption strong { color: var(--ink); }
    .phone {
      position: relative;
      height: min(780px, calc(100dvh - 112px));
      min-height: 620px;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 32px;
      background: var(--paper);
      box-shadow: 0 18px 45px rgba(20, 25, 30, .18);
    }

    .phone::before {
      content: "";
      position: absolute;
      z-index: 20;
      top: 8px;
      left: 50%;
      width: 94px;
      height: 24px;
      border-radius: 16px;
      background: var(--ink);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .app-screen {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: 39px;
      background: var(--panel);
    }

    .topbar {
      min-height: 54px;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      padding: 0 8px;
      background: var(--paper);
      border-bottom: 1px solid var(--soft-line);
    }

    .topbar h2 {
      margin: 0;
      font-size: 17px;
      text-align: center;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
    }

    .icon-btn:hover { background: var(--panel); }
    .icon-btn svg { width: 21px; height: 21px; }
    .topbar-spacer { width: 44px; height: 44px; }

    .content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 16px 96px;
    }

    .hero {
      margin-bottom: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
    }

    .hero h3 { margin: 0 0 4px; font-size: 21px; }
    .hero p { margin: 0; color: var(--muted); font-size: 14px; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .stat {
      padding: 10px 8px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      text-align: center;
    }
    .stat strong { display: block; font-size: 20px; }
    .stat span { color: var(--muted); font-size: 11px; }

    .card {
      margin-bottom: 12px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
    }

    .card-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .card-title h3, .card-title h4 { margin: 0; font-size: 16px; }
    .card-title small { color: var(--muted); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 26px;
      padding: 3px 8px;
      border: 1px solid currentColor;
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .status.pending { color: #875d0c; }
    .status.success { color: var(--success); }
    .status.danger { color: var(--danger); }
    .status.info { color: var(--accent); }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }
    .required { color: var(--danger); }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 48px;
      padding: 11px 12px;
      border: 1px solid #aeb5bd;
      border-radius: 8px;
      color: var(--ink);
      background: var(--paper);
      font-size: 16px;
    }
    .field textarea { min-height: 82px; resize: vertical; }
    .field .hint { margin: 5px 0 0; color: var(--muted); font-size: 12px; }

    .upload {
      min-height: 126px;
      display: grid;
      place-items: center;
      padding: 16px;
      border: 1px dashed #8b939d;
      border-radius: 8px;
      color: var(--muted);
      background: #fafafa;
      text-align: center;
      cursor: pointer;
    }
    .upload svg { width: 28px; height: 28px; margin-bottom: 6px; }
    .upload strong { display: block; color: var(--ink); font-size: 14px; }
    .upload small { display: block; margin-top: 3px; }

    .check-row, .info-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--soft-line);
      font-size: 14px;
    }
    .check-row:last-child, .info-row:last-child { border-bottom: 0; }
    .check-row span:first-child, .info-row span:first-child { color: var(--muted); }
    .check-row strong, .info-row strong { text-align: right; }

    .radio-card {
      width: 100%;
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--paper);
      text-align: left;
      cursor: pointer;
    }
    .radio-card.active { border: 2px solid var(--accent); background: var(--accent-soft); }
    .radio-dot {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      border: 2px solid var(--line);
      border-radius: 50%;
    }
    .active .radio-dot { border: 6px solid var(--accent); background: white; }
    .radio-card small { display: block; color: var(--muted); }

    .stepper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 16px;
    }
    .step {
      position: relative;
      padding-top: 22px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }
    .step::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 50%;
      width: 9px;
      height: 9px;
      z-index: 2;
      border: 2px solid var(--line);
      border-radius: 50%;
      background: var(--paper);
      transform: translateX(-50%);
    }
    .step::after {
      content: "";
      position: absolute;
      top: 11px;
      left: -50%;
      width: 100%;
      height: 1px;
      background: var(--line);
    }
    .step:first-child::after { display: none; }
    .step.done, .step.active { color: var(--ink); font-weight: 700; }
    .step.done::before, .step.active::before { border-color: var(--accent); background: var(--accent); }
    .step.done::after, .step.active::after { background: var(--accent); }

    .notice {
      margin-bottom: 14px;
      padding: 12px;
      border-left: 4px solid var(--muted);
      background: #eceff1;
      color: #454b53;
      font-size: 13px;
    }
    .notice.info { border-color: var(--accent); background: var(--accent-soft); }
    .notice.danger { border-color: var(--danger); background: #f7eaea; color: #6f2222; }

    .empty, .result {
      min-height: 360px;
      display: grid;
      place-content: center;
      padding: 26px;
      text-align: center;
    }
    .result-icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
      font-size: 30px;
      font-weight: 700;
    }
    .result h3 { margin: 0 0 8px; font-size: 21px; }
    .result p { margin: 0 auto 20px; color: var(--muted); font-size: 14px; }

    .timeline { padding-left: 9px; }
    .timeline-item {
      position: relative;
      padding: 0 0 22px 25px;
      border-left: 1px solid var(--line);
    }
    .timeline-item:last-child { padding-bottom: 0; border-left-color: transparent; }
    .timeline-item::before {
      content: "";
      position: absolute;
      top: 2px;
      left: -6px;
      width: 10px;
      height: 10px;
      border: 1px solid var(--muted);
      border-radius: 50%;
      background: var(--paper);
    }
    .timeline-item.current::before { border-color: var(--accent); background: var(--accent); }
    .timeline-item strong { display: block; font-size: 14px; }
    .timeline-item small { color: var(--muted); }

    .bottom-actions {
      position: absolute;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--soft-line);
      background: rgba(255, 255, 255, .97);
    }
    .bottom-actions.single { grid-template-columns: 1fr; }

    .btn {
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid var(--ink);
      border-radius: 8px;
      color: var(--ink);
      background: var(--paper);
      font-weight: 700;
      cursor: pointer;
    }
    .btn.primary { color: white; border-color: var(--accent); background: var(--accent); }
    .btn.danger { color: var(--danger); border-color: var(--danger); }
    .btn:active { opacity: .75; }
    .btn.full { width: 100%; }

    .bottom-nav {
      position: absolute;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      min-height: 76px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--soft-line);
      background: rgba(255, 255, 255, .97);
    }
    .nav-item {
      min-height: 52px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }
    .nav-item.active { color: var(--accent); font-weight: 700; }
    .nav-item svg { width: 21px; height: 21px; }

    .annotation-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
    }
    .annotation-no {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }
    .annotation-title h2 { margin: 0; font-size: 17px; }
    .annotation {
      padding: 12px 0;
      border-top: 1px solid var(--soft-line);
    }
    .annotation:first-of-type { border-top: 0; }
    .annotation strong { display: block; margin-bottom: 3px; font-size: 13px; }
    .annotation p { margin: 0; color: var(--muted); font-size: 13px; }
    .branch {
      margin-top: 16px;
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: white;
      font-size: 12px;
    }
    .branch strong { display: block; margin-bottom: 5px; }

    .mobile-header { display: none; }
    .drawer-backdrop { display: none; }

    @media (max-width: 1040px) {
      .workspace { grid-template-columns: 270px minmax(390px, 1fr); }
      .rail.right { display: none; }
    }

    @media (max-width: 720px) {
      body { background: var(--paper); }
      .workspace { display: block; }
      .rail.left {
        position: fixed;
        z-index: 50;
        top: 0;
        left: 0;
        width: min(320px, 88vw);
        height: 100dvh;
        transform: translateX(-105%);
        transition: transform .22s ease;
        box-shadow: 10px 0 30px rgba(0,0,0,.2);
      }
      .rail.left.open { transform: translateX(0); }
      .drawer-backdrop.open {
        position: fixed;
        z-index: 45;
        inset: 0;
        display: block;
        border: 0;
        background: rgba(0,0,0,.45);
      }
      .mobile-header {
        position: fixed;
        z-index: 30;
        top: 0;
        right: 0;
        left: 0;
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: env(safe-area-inset-top) 8px 0;
        border-bottom: 1px solid var(--line);
        background: white;
      }
      .mobile-header strong { font-size: 14px; }
      .stage { min-height: 100dvh; padding: 52px 0 0; }
      .phone-wrap { width: 100%; }
      .screen-caption { display: none; }
      .phone {
        height: calc(100dvh - 52px);
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .phone::before { display: none; }
      .app-screen { padding-top: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="workspace">
    <aside class="rail left" id="flowRail" aria-label="原型流程导航">
      <p class="eyebrow">Low-fi mobile H5</p>
      <h1>酒店拓展 UE</h1>
      <p class="intro">客户经理发展线下酒店，并与酒店联系人协同完成入驻、审核、试用和转正。</p>
      <div class="role-switch" role="tablist" aria-label="角色切换">
        <button type="button" id="managerRole" class="active" role="tab" aria-selected="true">客户经理</button>
        <button type="button" id="hotelRole" role="tab" aria-selected="false">酒店联系人</button>
      </div>
      <p class="section-label">页面流程 · 点击跳转</p>
      <nav class="flow-list" id="flowList"></nav>
    </aside>

    <button class="drawer-backdrop" id="drawerBackdrop" aria-label="关闭流程导航"></button>

    <header class="mobile-header">
      <button class="icon-btn" id="openFlow" aria-label="打开流程导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <strong id="mobileCaption">酒店拓展 UE</strong>
      <button class="icon-btn" id="mobileRole" aria-label="切换角色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7"/></svg>
      </button>
    </header>

    <main class="stage">
      <div class="phone-wrap">
        <div class="screen-caption">
          <span><strong id="screenName">M01 拓展工作台</strong> · 375 × 812</span>
          <span id="roleCaption">客户经理端</span>
        </div>
        <section class="phone" aria-live="polite">
          <div id="screenRoot"></div>
        </section>
      </div>
    </main>

    <aside class="rail right" aria-label="页面设计说明">
      <div class="annotation-title">
        <span class="annotation-no" id="annotationNo">M01</span>
        <h2 id="annotationTitle">拓展工作台</h2>
      </div>
      <div id="annotations"></div>
      <div class="branch" id="branchInfo"></div>
    </aside>
  </div>

  <script>
    const icons = {
      back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>',
      home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
      list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
      user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
      upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 15v5h16v-5"/></svg>',
      search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>'
    };

    const managerFlow = [
      { id: 'M01', name: '拓展工作台', note: ['聚合待处理、试用到期和近期申请。', '主操作固定为“发展新酒店”。'], branch: '主线入口 → 信用代码预查；也可从申请列表进入历史状态。' },
      { id: 'M02', name: '入驻预查', note: ['支持信用代码或营业执照识别。', '先预查再录入，避免重复拓展。'], branch: '未入驻 → M04；已入驻 → M03 终止。' },
      { id: 'M03', name: '已入驻结果', note: ['明确提示不可重复发展。', '保留联系运营入口，不提供继续提交。'], branch: '终态分支：酒店已被其他人员入驻，本次流程结束。' },
      { id: 'M04', name: '录入酒店快照', note: ['仅录入最小必要信息。', '联系人手机号将作为酒店方登录账号。'], branch: '提交后系统创建酒店联系人账号并发送邀请。' },
      { id: 'M05', name: '邀请确认', note: ['提交前再次核对酒店与联系人。', '清晰说明系统后续动作。'], branch: '确认 → M06；返回可修改快照信息。' },

      document.getElementById('hotelRole').classList.toggle('active', role === 'hotel');

      document.getElementById('hotelRole').setAttribute('aria-selected', String(role === 'hotel'));
    }

      document.getElementById('annotationNo').textContent = meta.id;
      document.getElementById('annotationTitle').textContent = meta.name;
      document.getElementById('annotations').innerHTML = meta.note.map((text, index) => `<div class="annotation"><strong>${index + 1}. 设计要点</strong><p>${text}</p></div>`).join('');
      document.getElementById('branchInfo').innerHTML = `<strong>流程去向</strong>${meta.branch}`;
      renderFlow();
      bindNavigation();
      document.querySelector('.content')?.scrollTo(0, 0);
    }

    function go(id) {
      if (!screens[id]) return;
      role = id.startsWith('M') ? 'manager' : 'hotel';
      screenId = id;
      render();
      closeDrawer();
    }

    function bindNavigation() {
      document.querySelectorAll('[data-go]').forEach(button => {
        button.addEventListener('click', () => go(button.dataset.go));
      });
    }

    function setRole(nextRole) {
      role = nextRole;
      screenId = nextRole === 'manager' ? 'M01' : 'H01';
      render();
    }

    function closeDrawer() {
      document.getElementById('flowRail').classList.remove('open');
      document.getElementById('drawerBackdrop').classList.remove('open');
    }

    document.getElementById('managerRole').addEventListener('click', () => setRole('manager'));
    document.getElementById('hotelRole').addEventListener('click', () => setRole('hotel'));
    document.getElementById('mobileRole').addEventListener('click', () => setRole(role === 'manager' ? 'hotel' : 'manager'));
    document.getElementById('openFlow').addEventListener('click', () => {
      document.getElementById('flowRail').classList.add('open');
      document.getElementById('drawerBackdrop').classList.add('open');
    });
    document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
    render();
  </script>
</body>
</html>
